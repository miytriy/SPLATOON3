<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>インク・ペイントシステム プロトタイプ</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <h1>Ink <span>Paint</span> System — Prototype</h1>
  <div id="stage-wrap">
    <canvas id="stage" width="1000" height="600"></canvas>
    <div id="hud">
      <div class="card">
        <div id="coverage-label">塗りポイント</div>
        <div id="coverage-value">0pt</div>
      </div>
      <div class="card" id="weapon-card">
        <div id="coverage-label">ブキ</div>
        <div id="weapon-name" style="font-weight:700; font-size:15px;">–</div>
        <div id="weapon-stats" style="font-size:11px; color:var(--muted); margin-top:2px;">–</div>
        <div id="dummy-status" style="font-size:11px; margin-top:6px; color:var(--accent);">–</div>
        <div id="hit-probability" style="font-size:11px; margin-top:4px; color:var(--accent);">–</div>
        <div id="charge-wrap" style="display:none; margin-top:6px;">
          <div id="coverage-label">チャージ</div>
          <div id="charge-gauge-outer" style="width:140px; height:8px; border-radius:4px; background:#0b0c10; overflow:hidden; margin-top:4px; border:1px solid #33384a;">
            <div id="charge-gauge-inner" style="height:100%; width:0%; background: linear-gradient(90deg, var(--accent), #fff); transition: width .05s linear;"></div>
          </div>
        </div>
      </div>
      <div class="card" style="text-align:right">
        <div id="coverage-label">インク残量</div>
        <div id="ink-gauge-outer"><div id="ink-gauge-inner"></div><div id="ink-predict-band"></div></div>
        <div id="swim-badge">◆ ヒト状態：自然回復のみ</div>
      </div>
    </div>
  </div>
  <div id="footer">
    <div><kbd>W A S D</kbd> 移動</div>
    <div><kbd>マウス</kbd> 照準　<kbd>左クリック(長押し)</kbd> 発射／チャージャーはチャージして離すと発射(ヒト状態のみ)</div>
    <div><kbd>右クリック(長押し)</kbd> イカ状態(左クリック無効・自陣インク上で急速回復)</div>
    <div><kbd>Shift(長押し)</kbd> 照準ロック(カニ歩き)</div>
    <div><kbd>R</kbd> サブウェポン</div>
　　<button id="sub-btn">サブウェポンを使用</button>
    <div><kbd>N</kbd> リセット</div>
    <button id="reset-btn">塗りをリセット</button>
    <div id="weapon-switch"></div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
